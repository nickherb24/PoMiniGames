<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoMiniGames</title>
    <!-- Hold the first frame until the boot splash heading is parsed: it is the far end of the
         card-to-game view transition (see #po-boot-hero below). -->
    <link rel="expect" href="#po-boot-hero" blocking="render" />
    <base href="/" />

    <!-- Bug fix QA #10: start the WASM download as early as possible so the
         browser can warm up the connection and overlap the TCP/TLS handshake
         with the HTML parse. The actual script tag below drives execution;
         the modulepreload just primes the network. ~1.2 s cold-start win.
         Note: only blazor.webassembly.js is the real, non-hashed boot script.
         The dotnet.* runtime + native modules are emitted with content hashes
         and discovered at runtime by the Blazor loader — preloading them by
         their unhashed names 404s and pollutes DevTools with red noise. -->
    <!-- The import map MUST stay above the modulepreload below, and above every
         other module script on the page. Per the HTML spec an import map is
         rejected once a module load has already been *triggered*, and a
         `modulepreload` counts as triggering one — so while this block sat lower
         in the head (next to glass.css, where it lived until 2026-09-11) Chrome
         logged "An import map is added after module script load was triggered"
         on EVERY page load and threw the whole map away.

         That was not cosmetic: with no map, `import "three"` is a bare specifier
         with nothing to resolve against, so engineLoader.js failed with
         "Failed to resolve module specifier" and PoMarbleRace and PoVoxelStrike
         rendered no canvas at all — both games were completely dead. Verified by
         re-running both routes after the hoist: three.module.js, cannon-es and
         ~20 addons fetch, the canvas renders, console is clean.

         Anything that adds a module script earlier than this line reintroduces
         the bug silently — the games just stop, with one console line. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js": "sha384-Qvl1RLjZOCDFOOH2bKcGnaDHMM8MVv3zVtMvhy3juQdiIOs6RgQ/7zYdM1FbpHzI",
        "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js": "sha384-LDCkTUkpgO4r4LtCJLXk5kwgo36GMMbF99L04+unS4RQdoKCAhj6jZ2B+2CkdSyo"
      }
    }
    </script>

    <link rel="modulepreload" href="_framework/blazor.webassembly.js" />

    <!-- Theme resolution, inline and render-blocking ON PURPOSE.
         app.css keys the light palette off `<html data-theme="light">` rather than
         a `prefers-color-scheme` media query, so that an explicit user choice
         (Profile → Preferences) can beat the OS. That means SOMETHING has to stamp
         the attribute, and it has to happen before first paint or a dark-default
         page flashes at a light-mode user on every navigation.
         Blazor WASM cannot do it — it boots long after first paint — so this runs
         here, ahead of the stylesheet. Keep it inline: an external file would be a
         second round-trip in front of the render.
         "auto" (or an unset/corrupt value) resolves against the OS preference and
         is re-resolved live by the matchMedia listener in appPrefs.js. -->
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('pomini_theme') || 'auto';
                if (mode !== 'light' && mode !== 'dark') {
                    mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', mode);
                // Same story for motion, and for the same reason app.css keys the
                // light palette off an attribute: resolving `prefers-reduced-motion`
                // to a concrete value HERE is what lets the stylesheet carry one
                // universal-selector guard instead of an attribute rule plus a
                // duplicate @media copy of it. Either source wins — an explicit
                // opt-in, or an OS that already asked for less motion. Turning the
                // app toggle off therefore does not re-enable motion for someone
                // whose system requested it. appPrefs.js keeps this live.
                if (localStorage.getItem('pomini_reducedmotion') === '1'
                    || matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    document.documentElement.setAttribute('data-motion', 'reduce');
                }
                // Colour-blind-safe palettes: stamped here so a game engine that
                // boots before Blazor still sees it (appPrefs.applyColorSafe).
                if (localStorage.getItem('pomini_colorsafe') === '1') {
                    document.documentElement.setAttribute('data-colorsafe', '1');
                }
            } catch (e) {
                // Private mode / storage disabled — fall back to the dark default.
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Typography — self-hosted (see css/fonts.css for the full rationale).
         This replaces preconnects + preloads to rsms.me and fonts.googleapis.com.
         Those were two external origins on the render path, and the Google one is
         itself a stylesheet that then fetches from fonts.gstatic.com — the actual
         font bytes were four hops deep, could not be service-worker cached for
         offline play, and leaked every visitor's IP to two third parties.

         Now same-origin: one small stylesheet plus the woff2 files it points at.
         The sheet is render-blocking (it is ~70 lines and same-origin, so it costs
         nothing meaningful) while the FONT FILES are not — `font-display: swap`
         means text paints in system-ui immediately and swaps when they land.

         The Inter file is preloaded because it is used by every page's headings;
         Bungee is not, because only PoBrawl uses it and preloading it would fetch
         35 KB on every visit for one game. The `crossorigin` on the preload is
         required even same-origin: fonts are always fetched in CORS mode, and
         without it the browser fetches the file twice. -->
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />

    <!-- Remove Bootstrap – all styles are custom (payload savings ~187KB) -->
    <!-- app.css carries the design tokens + app shell — render-blocking on purpose
         so first paint is fully styled. -->
    <link rel="stylesheet" href="css/app.css" />
    <!-- app-shell.css: the SHARED, non-scoped top-bar chrome. Render-blocking so
         the header is styled on first paint. Non-scoped (unlike MainLayout's
         component CSS) so every layout reusing the gl-top-bar markup inherits
         identical chrome instead of rendering bare. -->
    <link rel="stylesheet" href="css/app-shell.css" />
    <!-- §3 Per-game stylesheets are non-render-blocking: each only matters once its
         game route is entered (by which point it's cached), so loading them async
         keeps first paint gated on app.css alone (~640 lines) instead of the full
         ~5,400-line global bundle. Same preload-swap pattern used for the webfonts. -->
    <!-- game-shell.css is the SHARED game chrome (the end-of-game modal every
         game ends on). Loaded ahead of games.css so per-game rules can't win a
         specificity tie against it by accident. -->
    <link rel="preload" href="css/game-shell.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="css/games.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <!-- §GFX fx.css: platform effects layer (glass, animatable gradients,
         compositor-only motion, adaptive-quality rules). Purely additive utility
         classes — nothing in it restyles an existing element, so it is safe to
         load async alongside the per-game sheets. -->
    <link rel="preload" href="css/fx.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <!-- fight.css deleted 2026-08-07: 22 classes, none referenced by any markup.
         It was the stylesheet for the old PoFight game and did not follow that
         game through its rename to PoBrawl, which styles itself from
         PoBrawlPage.razor.css (.pb-*). It stayed preloaded on every page for
         7.8 KB that could never match an element. -->
    <!-- PoJoker (demo game): hand-written medieval-dark theme (scoped to .pojoker-root) -->
    <link rel="preload" href="css/pojoker-theme.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="PoMiniGames — instant-play mini-games with AI opponents, real-time 2P multiplayer, and global leaderboards. Offline-resilient." />
    <meta property="og:title" content="PoMiniGames" />
    <meta property="og:description" content="Instant-play mini-games · AI opponents · real-time 2P multiplayer · leaderboards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="PoMiniGamesClient.styles.css" rel="stylesheet" />
    <!-- §GFX-6 glass.css is the APPLIED glassmorphism layer (fx.css holds the
         primitives). It must stay LAST: several of its targets are styled by
         Blazor scoped CSS, whose `[b-xxxxxxxxxx]` selectors it matches on
         specificity via doubled class names and then beats on source order.
         Move this line above PoMiniGamesClient.styles.css and every per-game
         HUD silently loses the treatment. Not preloaded-async for the same
         reason — the swap would reinsert it at its original position anyway,
         but a render-blocking load also avoids a flash of unglassed chrome. -->
    <link rel="stylesheet" href="css/glass.css" />

    <!-- Shared canvas resolution policy (audit #8). Not deferred and listed
         first among the game scripts: the racing renderer and the engine modules
         read window.PoCanvasDpr during their own setup. -->
    <script src="js/canvasDpr.js"></script>
    <!-- Reports uncaught errors, console.error and lost WebGL contexts to the server
         log (POST /client-errors). Must stay ABOVE consoleFilter.js: the filter then
         wraps this file's console.error, so the noise it drops is never reported. -->
    <script src="js/errorReporter.js"></script>
    <!-- Kiosk reel polish: filter the harmless "AudioContext closed" warnings
         that print on every demo transition. Loaded eagerly so it wraps
         console.warn/error before the game audio modules install their paths.
         The original methods are stashed on window.__poConsole for debugging. -->
    <script src="js/consoleFilter.js"></script>
    <!-- View Transitions + App enhancements (Suggestion #5) -->
    <script src="js/app.js" defer></script>
    <!-- AppErrorBoundary fallback clipboard helper (non-secure-context safe) -->
    <script src="js/appErrorBoundary.js" defer></script>
    <!-- Microsoft sign-in (MSAL.js + interop wrapper). Loaded eagerly so the
         login gate can call poAuth.* during startup when OAuth is configured.
         The integrity hash pins the exact file: bump it together with the version. -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.4/lib/msal-browser.min.js"
            integrity="sha384-FyFWjaUFP9q0tLEvcwV9UloGlRNkfP3l+vmNCjwLpji7ChADDrvdXXXNIufO0sEw"
            crossorigin="anonymous"></script>
    <script src="js/poauth.js"></script>
</head>

<body>
    <!-- Card-to-game morph (2026-10-01). A hub chip is a full page load (js/app.js), so the
         pressed card cannot morph into the game's own intro card: this splash is the first
         frame of the new document. app.js names the card's heading `po-hero` and leaves its
         icon and title in sessionStorage; this heading takes the same name (app.css), so the
         browser's cross-document view transition glides the card up into it while the game
         boots underneath. With no key, or a key for another path (direct load, back button),
         it stays hidden and the splash is the plain spinner.
         A sibling of #app, not a child: Blazor empties #app the moment it mounts, a beat
         before the first real page renders, and the heading has to bridge that beat. app.css
         hides it once #app holds anything but the spinner. Keep the script directly after
         the element: it has to run before the first frame is painted. -->
    <div id="po-boot-hero" class="po-boot-hero" hidden><span></span><strong></strong></div>
    <script>
        (function () {
            try {
                var h = JSON.parse(sessionStorage.getItem('poHero') || 'null');
                sessionStorage.removeItem('poHero');
                if (!h || h.path !== location.pathname + location.search) return;
                var el = document.getElementById('po-boot-hero');
                el.firstChild.textContent = h.icon;
                el.lastChild.textContent = h.title;
                el.hidden = false;
            } catch (e) { /* storage blocked or a bad value: the plain spinner */ }
        })();
    </script>
    <div id="app">
        <svg class="loading-progress" viewBox="0 0 100 100">
            <circle r="40" cx="50" cy="50" />
            <circle r="40" cx="50" cy="50" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
          <a href="/" class="reload">Reload app</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Per-game interop is NOT loaded here any more (2026-08-07).
         poFunQuizSplitHotkeys.js, pojoker-speech-interop.js,
         pojoker-audio-interop.js, gl-fps.js and ambientMusic.js were global
         <script> tags, so every page in the app fetched and parsed ~39 KB of
         code that exactly one game (or one opt-out diagnostic) ever calls.
         Each is now imported at its point of use — see JokerAudioService,
         JokerSpeechService, PoFunQuizPage and FpsCounter.
         They assign their window.* globals on evaluation, so the existing
         InvokeVoidAsync("poJokerAudio.…") style call sites are unchanged. -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- ── Game engines: route-gated, NOT loaded here ──────────────────────────
         marblerace, pobrawl, posports and poracer used to be five eager <script>
         tags at this position. Together with their three.js / cannon-es imports
         that is ~24,600 lines of JavaScript parsed on first paint to render a
         menu, and almost no session opens more than one game.

         They are now pulled in by js/engineLoader.js when a game page actually
         mounts. The interop contract is unchanged — each engine still registers
         its window.PoBrawl / window.PoMarbleRace / … global, and pages still call
         through it; the page just awaits `loadEngine('<name>')` first.

         PoRacer's input, renderer, interpolation and compositor are imported
         explicitly by js/poracer/index.js. -->
    <script type="module" src="js/engineLoader.js"></script>

    <!-- §GFX/SOUND platform runtime (2026-07-29).
         audioBus.js owns the app's ONE AudioContext and the master/music/sfx/ui
         mix graph; five modules used to construct a context each. It must be
         imported before any module that plays a sound, hence its position here.
         visualRuntime.js runs the single rAF loop that publishes both the
         analyser bands (--audio-*) and the adaptive-quality tier (data-gfx). -->
    <script type="module" src="js/audioBus.js"></script>
    <script type="module" src="js/visualRuntime.js"></script>
    <!-- §GFX-10 synthesis moved to an AudioWorklet; dsp.js is the main-thread
         front end and acoustics.js owns the per-game reverb spaces. Both are
         inert until first use — the worklet module is fetched lazily on the
         first cue, not here, because addModule() needs a live AudioContext and
         that only exists after a user gesture. -->
    <script type="module" src="js/dsp.js"></script>
    <script type="module" src="js/acoustics.js"></script>
    <!-- §GFX-11 the sound vocabulary. Imports dsp/impact/gpuFx and is what call
         sites should use: one fire() gets audio, screen feel and particles. -->
    <script type="module" src="js/gameCues.js"></script>
    <!-- §GFX-7/8 shared feel layer. Both are inert on load: impactBus.js only
         appends its flash div, gpuFx.js does not touch WebGL until the first
         burst. Loading them here rather than lazily means a game's first hit
         does not pay a module fetch at the exact frame it needs to be smooth. -->
    <script type="module" src="js/impactBus.js"></script>
    <script type="module" src="js/gpuFx.js"></script>
    <!-- §GFX-6 pointer-tracked tilt for [data-fx-tilt] surfaces. One delegated
         listener; idle until something is hovered. -->
    <script type="module" src="js/fxTilt.js"></script>
    <!-- §GFX-12…21 the quality/palette/sound bootstrap. Decides the device's
         quality tier BEFORE any game asks for it, owns the dynamic accent
         palette, arms the music director's audio-context gesture kick, and
         background-probes WebGPU for the particle backend. Everything heavier
         (glass captures, weather, props) stays lazy in the games that use it. -->
    <script src="js/fxBootstrap.js" defer></script>
    <!-- Native <dialog> interop (Option #9). showModal / close are HTMLDialogElement
         methods Blazor's ElementReference doesn't bind directly, so a tiny shim
         exposes them on `window.PoDialogInterop`. Must be present BEFORE the
         GameOverModal renders; defer keeps it off the critical render path. -->
    <script src="js/dialogInterop.js" defer></script>
    <!-- PWA: service worker registration + connectivity signals. Registration is
         kicked off from MainLayout (not here) so the update toast has a live Blazor
         renderer to display into. -->
    <!-- PWA: service worker registration + connectivity signals -->
    <script src="js/pwa.js" defer></script>
</body>

</html>
